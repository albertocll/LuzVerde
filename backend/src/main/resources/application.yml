spring:
  application:
    name: luz-verde
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/luzverde}
    username: ${DB_USER:luzverde}
    password: ${DB_PASSWORD}
  flyway:
    # Las bases de datos creadas antes de Flyway (con ddl-auto: update) se marcan como
    # versión 1 sin ejecutar V1, porque ya tienen esas tablas.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crean las migraciones de Flyway (db/migration). Hibernate solo comprueba
      # al arrancar que las entidades coinciden con las tablas.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  # En local no hay proxy: se ignora X-Forwarded-For para que nadie falsee su IP.
  # Detrás del proxy de Railway se pone FORWARD_HEADERS_STRATEGY=native y los límites
  # de login y de registro por IP usan la IP real del cliente. Tomcat solo cree la
  # cabecera si la petición llega desde una IP privada (la del proxy) y toma la última
  # IP que no es de un proxy, así que un cliente no puede colar otra IP delante.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

luzverde:
  app:
    # Versión mínima de la app (formato 1.2.3). Si la instalada es menor, la app pide actualizar.
    version-minima: ${APP_VERSION_MINIMA:1.0.0}
  jwt:
    # Clave en Base64 de al menos 32 bytes. Solo por variable de entorno.
    secreto: ${JWT_SECRET}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:1440}

  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    # El modelo más pequeño que da buenos resultados. Se puede cambiar sin tocar código.
    modelo: ${ANTHROPIC_MODELO:claude-haiku-5-5}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:2048}
    url: https://api.anthropic.com/v1/messages
    limite-diario: ${LIMITE_IA_DIARIO:10}

# Swagger solo se activa a propósito (Docker Compose local lo hace). En producción queda apagado.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
