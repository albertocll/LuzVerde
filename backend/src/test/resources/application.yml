# La base de datos la pone TestBase: un PostgreSQL real en Docker con Testcontainers.
spring:
  jpa:
    open-in-view: false
    hibernate:
      # Igual que en producción: el esquema sale de las migraciones de Flyway.
      ddl-auto: validate

luzverde:
  app:
    version-minima: 1.2.3
  jwt:
    # Clave falsa solo para tests. No se usa en ningún entorno real.
    secreto: dGVzdC1zb2xvLXBhcmEtdGVzdHMtbm8tdXNhci1lbi1wcm9kdWNjaW9uLTEyMzQ1Njc4
    expiracion-minutos: 60
  claude:
    api-key: clave-falsa-de-test
    modelo: modelo-de-test
    max-tokens: 2048
    url: http://localhost:9/no-se-usa
    limite-diario: 10

# Igual que en producción: Swagger apagado salvo que se active.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
