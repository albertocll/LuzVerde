# Entorno de desarrollo local. Los valores salen del archivo .env (no se sube al repo).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: luzverde
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Solo accesible desde este ordenador, no desde la red local.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d luzverde"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/luzverde
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SWAGGER_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  datos-postgres:
