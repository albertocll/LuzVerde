name: Error
description: Algo no funciona como debería
labels: [error]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué has visto y qué esperabas ver.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entra en ...
        2. Pulsa ...
        3. Aparece ...
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: Parte afectada
      options: [Backend, App, Evaluador, Generador de CV, Despliegue]
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Android 15 en emulador, backend local con Docker"
  - type: markdown
    attributes:
      value: "No pegues tokens, claves ni datos personales reales. Para fallos de seguridad, mira SECURITY.md."
